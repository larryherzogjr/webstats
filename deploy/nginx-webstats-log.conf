# Install this file as /etc/nginx/conf.d/webstats-log.conf. Ubuntu includes
# conf.d files inside the nginx http block.

map $host $webstats_loggable {
    default 0;

    larryherzogjr.com     1;
    www.larryherzogjr.com 1;
    pick5.ospdy.com        1;
    hdu.ospdy.com          1;
    euphonium.studio       1;
    www.euphonium.studio   1;
    alexis.tips            1;
    www.alexis.tips        1;
    herzogenclave.com      1;
    www.herzogenclave.com  1;
}

# Standard combined data with the host as the first field. Ad Fontes is not in
# the map and therefore does not inherit this log.
log_format webstats_combined_host
    '$host $remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" $request_time';

# Privacy-reduced format for the Ad Fontes HTTPS server. $uri excludes the query
# string, and the referrer field is a literal dash. Its shape still matches the
# combined_host parser.
log_format webstats_private_host
    '$host $remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent" $request_time';

access_log /var/log/nginx/webstats.access.log webstats_combined_host
    if=$webstats_loggable;
