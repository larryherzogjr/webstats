<section class="filters" aria-label="Traffic filters">
  <div class="presets" role="group" aria-label="Date range">
    <button data-days="1">Today</button>
    <button class="active" data-days="7">7 days</button>
    <button data-days="30">30 days</button>
    <button data-days="90">90 days</button>
  </div>
  <div class="custom-dates">
    {% if site_filter %}
    <label>Site <select id="site-filter"><option value="">All sites</option></select></label>
    {% endif %}
    <label>From <input id="date-from" type="date"></label>
    <label>To <input id="date-to" type="date"></label>
    <button id="apply-dates">Apply</button>
  </div>
  <div class="toggles">
    {% if not force_bots %}
    <label class="switch"><input id="include-bots" type="checkbox"> Include bots</label>
    {% endif %}
    {% if not hide_assets %}
    <label class="switch"><input id="include-assets" type="checkbox"> Include assets</label>
    {% endif %}
  </div>
</section>
