{% extends "base.html" %}
{% block title %}Overview | Webstats{% endblock %}
{% block page_id %}overview{% endblock %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">All properties</p><h1>Traffic overview</h1></div>
  <p id="range-label" class="range-label"></p>
</div>
{% include "_filters.html" %}
<div id="page-error" class="alert hidden" role="alert"></div>
<section id="site-cards" class="site-grid" aria-live="polite"></section>
<section class="panel chart-panel">
  <div class="panel-heading"><div><p class="eyebrow">Daily traffic</p><h2>Requests by site</h2></div><span class="legend-note">Humans, pages only by default</span></div>
  <div class="chart-wrap"><canvas id="overview-chart"></canvas></div>
</section>
<section class="metric-grid" id="server-metrics" aria-label="Server-wide metrics"></section>
{% endblock %}
